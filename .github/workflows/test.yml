name: Build and Test

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --project xUnitTest/xUnitTest.csproj -c Release --no-build --coverage --coverage-settings xUnitTest/coverage.config --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --results-directory TestResults
